[package]
name = "chumod-loader"
version = "2.0.1"
edition = "2021"

[lib]
name = "version"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
retour = "0.4.0-alpha.4"
once_cell = "1"

[build-dependencies]
forward-dll = "0.1.11"

[profile.release]
lto = true
opt-level = "s"
